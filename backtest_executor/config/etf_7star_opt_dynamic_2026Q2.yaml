# 策略优化配置文件：7星 ETF 策略 (Dynamic Pool, 2026Q2)
# 路径：backtest_executor/config/etf_7star_opt_dynamic_2026Q2.yaml

strategy:
  file: "strategies/etf_rotation/ETF_7star_opt_dynamic.py"
  # base_id 仅作记录参考
  base_id: "7star_dynamic_base_20260413"

results:
  # 回测记录文件名，保存目录仍为 backtest_executor/results/{策略文件名}/
  mapper_file: "mapper_2026Q2.json"

backtest:
  start_day: "2026-03-01"
  end_day: "2026-06-30"
  initial_cash: 100000

# 全局参数库定义
params:
  S:
    var: EXECUTION_SCORE_THRESHOLD
    default: [0, 5]
    values: [[0, 4], [0, 5], [0, 6], [0, 8], [0, 10]]
  st:
    var: EXECUTION_SHORT_MOMENTUM_PARAM
    default: [false, 10, 0.0]
    values: [[false, 10, 0.0], [true, 10, 0.0]]
  r:
    var: EXECUTION_R2_PARAM
    default: [false, 0.4]
    values: [[false, 0.4], [true, 0.3], [true, 0.4], [true, 0.5], [true, 0.6]]
  ar:
    var: EXECUTION_ANNUAL_RETURN_PARAM
    default: [false, 1.0]
    values: [[false, 1.0], [true, 1.0]]
  ma:
    var: EXECUTION_MA_PARAM
    default: [false, 20]
    values: [[false, 20], [true, 20]]
  v:
    var: EXECUTION_VOLUME_PARAM
    default: [false, 5, 1.0]
    values: [[false, 5, 1.0], [true, 5, 0.8], [true, 5, 1.0], [true, 5, 1.2], [true, 5, 1.5], [true, 5, 2.0]]
  ls:
    var: EXECUTION_LOSS_PARAM
    default: [true, 0.97]
    values: [[true, 0.97], [false, 0.97]]
  fl:
    var: EXECUTION_FIXED_STOPLOSS
    default: [false, 0.95]
    values: [[false, 0.95], [true, 0.95]]
  slday:
    var: EXECUTION_SELL_COOLDOWN
    default: [false, 3]
    values: [[false, 3], [true, 3]]
  fm:
    var: EXECUTION_FLITER_MARKET
    default: [false, false, true]
    values: [[false, false, true], [true, false, true], [false, true, true]]

